services:
  portal:
    build: .
    image: result-portal:assignment5
    ports: ["8000:8000"]
    depends_on: [db]
    environment:
      DATABASE_URL: postgresql://portal:change-me@db:5432/results
    cpus: 1.0
    mem_limit: 512m
    restart: unless-stopped
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: results
      POSTGRES_USER: portal
      POSTGRES_PASSWORD: change-me
    volumes: [results-data:/var/lib/postgresql/data]
    cpus: 1.0
    mem_limit: 1g
    restart: unless-stopped
volumes:
  results-data:
